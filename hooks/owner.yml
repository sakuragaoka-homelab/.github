# hooks/owner.yml — sakuragaoka-homelab owner jobs.
# Loaded through `remotes` at the same pinned tag as hooks/core.yml.
# Every job calls a `just` recipe from standards/owner.md. Repository jobs
# never reuse an `owner-*` name.
pre-commit:
  jobs:
    - name: owner-privacy-identity
      run: just privacy-identity
      fail_text: "The author or committer email is not the owner's GitHub no-reply address (H1)."

    - name: owner-privacy-staged
      run: just privacy-staged
      fail_text: "A staged blob contains private material (H1). Remove it and stage again."
